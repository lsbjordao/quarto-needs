title: Quarto Needs
author: Quarto-Needs contributors
version: 0.1.0
quarto-required: ">=1.6.0"
contributes:
  filters:
    - needs.lua
    - margin-sidebar.lua
  shortcodes:
    - shortcodes.lua
    - adr-shortcodes.lua
  # The starter template deliberately vendors the extension without an owner
  # namespace. Current Quarto releases still have an open bug copying scoped
  # extension directories from `quarto use template`; the direct `quarto add`
  # path is namespaced and uses the canonical manifest instead.
  metadata:
    project:
      pre-render:
        - quarto run _extensions/quarto-needs/bootstrap-entry.py

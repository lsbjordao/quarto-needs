title: Quarto Needs
author: Lucas Sá Barreto Jordão
version: 0.1.1
quarto-required: ">=1.6.0"
contributes:
  filters:
    - needs.lua
    - margin-sidebar.lua
  shortcodes:
    - shortcodes.lua
    - adr-shortcodes.lua
  # GitHub template installation adds the owner namespace; local installation
  # does not. The starter's project-local entry delegates to either layout.
  metadata:
    project:
      pre-render:
        - quarto run quarto-needs-bootstrap.py

project:
  type: book
  output-dir: _book

book:
  title: "Quarto-Needs — Manual"
  subtitle: "Requirements, decisions and engineering traceability as code"
  navbar:
    search: true
  chapters:
    - index.qmd
    - getting-started.qmd
    - engineering-model.qmd
    - authoring.qmd
    - architecture-decisions.qmd
    - executable-evidence.qmd
    - evidence-providers.qmd
    - governance.qmd
    - declarative-policies.qmd
    - reference.qmd

format:
  html:
    theme: cosmo
    css: language-switch.css
    include-after-body: language-switch.html
    toc: true
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto

babelquarto:
  languagelinks: navbar
  icon: ""
  languagecodes:
    - name: en
      text: "English"
    - name: pt-BR
      text: "Português (Brasil)"
  mainlanguage: en
  languages: [pt-BR]

title-pt-BR: "Quarto-Needs — Manual"
description-pt-BR: "Requisitos, decisões e rastreabilidade de engenharia como código"
lang: en

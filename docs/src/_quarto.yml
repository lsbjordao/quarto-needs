  navbar:
    search: true
  google-analytics: G-84LW77BJNG
  chapters:
    - index.qmd
    - getting-started.qmd
    - engineering-model.qmd
    - named-queries.qmd
    - authoring.qmd
    - views-reference.qmd
    - architecture-decisions.qmd
    - c4-architecture.qmd
    - executable-evidence.qmd
    - evidence-providers.qmd
    - governance.qmd

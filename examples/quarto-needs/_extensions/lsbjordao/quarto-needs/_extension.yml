title: Quarto Needs
author: Lucas Sá Barreto Jordão
version: 0.2.0
quarto-required: ">=1.6.0"
contributes:
  filters:
    - needs.lua
    - margin-sidebar.lua
  shortcodes:
    - shortcodes.lua
    - adr-shortcodes.lua
  # `quarto add lsbjordao/quarto-needs` installs GitHub extensions below
  # `_extensions/<owner>/<name>`. Keep the contributed command relative to
  # the project so paths containing spaces remain safe on supported Quarto
  # releases; the tiny entrypoint records the active extension directory for
  # the managed engine before delegating to bootstrap.py.
  metadata:
    project:
      pre-render:
        - quarto run _extensions/lsbjordao/quarto-needs/bootstrap-entry.py

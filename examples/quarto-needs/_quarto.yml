project:
  type: book
  output-dir: _book
  pre-render: python3 _pre_render.py

book:
  title: "Engineering Quarto-Needs with Quarto-Needs"
  subtitle: "A self-hosted requirements, architecture, verification and traceability case study"
  navbar:
    search: true
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - context.qmd
    - drivers.qmd
    - requirements.qmd
    - architecture.qmd
    - implementation.qmd
    - verification.qmd
    - interoperability.qmd
    - traceability.qmd
    - change.qmd

format:
  html:
    theme: 
      light: cosmo
      dark: darkly
    css: language-switch.css
    include-after-body: language-switch.html
    mermaid-format: svg

filters:
  - quarto-needs

quarto-needs:
  margin-sidebar-toggle: true

babelquarto:
  languagelinks: navbar
  icon: ""
  languagecodes:
    - name: en
      text: "English"
    - name: pt-BR
      text: "Português (Brasil)"
  mainlanguage: en
  languages: [pt-BR]

title-pt-BR: "Engenharia do Quarto-Needs com Quarto-Needs"
subtitle-pt-BR: "Um estudo de caso autocontido de requisitos, arquitetura, verificação e rastreabilidade"
lang: en

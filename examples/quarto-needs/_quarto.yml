project:
  type: book
  output-dir: _book
  pre-render: python3 _pre_render.py

book:
  title: "Engineering Quarto-Needs with Quarto-Needs"
  subtitle: "A self-hosted requirements, architecture, verification and traceability case study"
  navbar:
    search: true
  sidebar:
    collapse-level: 1
  chapters:
    - index.qmd
    - context.qmd
    - drivers.qmd
    - requirements.qmd
    - architecture.qmd
    - implementation.qmd
    - verification.qmd
    - interoperability.qmd
    - traceability.qmd
    - change.qmd
    - tags.qmd

format:
  html:
    theme: 
      light: cosmo
      dark: darkly
    # The default article layout reserves wide screen/page gutters that pin the
    # sidebar ~76px off the left edge and squeeze the content column; full
    # keeps the sidebar at the edge and gives the room to the content.
    page-layout: full
    css: language-switch.css
    include-after-body: language-switch.html
    mermaid-format: svg

filters:
  - quarto-needs

quarto-needs:
  margin-sidebar-toggle: true
  # Tag badges anywhere in the book deep-link into the Tags chapter
  # pre-filtered. The name resolves per language (babelquarto mirrors
  # chapter names under pt-BR/); use a locale-suffixed key such as
  # `tags-page-pt-br` only when a translation names its chapter differently.
  tags-page: tags

babelquarto:
  languagelinks: navbar
  icon: ""
  languagecodes:
    - name: en
      text: "English"
    - name: pt-BR
      text: "Português (Brasil)"
  mainlanguage: en
  languages: [pt-BR]

title-pt-BR: "Engenharia do Quarto-Needs com Quarto-Needs"
subtitle-pt-BR: "Um estudo de caso autocontido de requisitos, arquitetura, verificação e rastreabilidade"
lang: en

<script>
(() => {
  const locale = document.documentElement.lang || "en";
  const isPt = locale.toLowerCase().startsWith("pt");

  const asDir = (url) => new URL("./", url);
  const stripLocalizedSuffix = (name) => name.replace(/\.pt-BR\.html$/i, ".html");
  const addLocalizedSuffix = (name) => name.replace(/\.html$/i, ".pt-BR.html");

  const relativeHref = (from, to) => {
    const fromParts = asDir(from).pathname.split("/").filter(Boolean);
    const toParts = to.pathname.split("/").filter(Boolean);
    let common = 0;
    while (common < fromParts.length && common < toParts.length && fromParts[common] === toParts[common]) common += 1;
    const up = Array(fromParts.length - common).fill("..");
    const down = toParts.slice(common);
    return `${[...up, ...down].join("/") || "./"}${to.search}${to.hash}`;
  };

  const homeLink = document.querySelector(
    ".sidebar-title a, a.sidebar-title, .navbar-brand, .quarto-secondary-nav a[href]"
  );
  const fallbackHome = isPt ? "index.pt-BR.html" : "index.html";
  const localizedHome = new URL(homeLink?.getAttribute("href") || fallbackHome, window.location.href);

  let bookRoot;
  if (isPt && /\/pt-BR\//i.test(localizedHome.pathname)) {
    bookRoot = new URL("../", asDir(localizedHome));
  } else {
    bookRoot = asDir(localizedHome);
  }

  const current = new URL(window.location.href);
  let logicalPath;
  if (isPt) {
    const marker = "/pt-BR/";
    const index = current.pathname.toLowerCase().indexOf(marker.toLowerCase());
    logicalPath = index >= 0 ? current.pathname.slice(index + marker.length) : current.pathname.split("/").pop();
    logicalPath = stripLocalizedSuffix(logicalPath || "index.pt-BR.html");
  } else {
    const rootPath = bookRoot.pathname.endsWith("/") ? bookRoot.pathname : `${bookRoot.pathname}/`;
    logicalPath = current.pathname.startsWith(rootPath)
      ? current.pathname.slice(rootPath.length)
      : current.pathname.split("/").pop();
    logicalPath = logicalPath || "index.html";
  }

  const target = isPt
    ? new URL(logicalPath, bookRoot)
    : new URL(`pt-BR/${addLocalizedSuffix(logicalPath)}`, bookRoot);
  target.search = current.search;
  target.hash = current.hash;

  const targetLabel = isPt ? "English" : "Português (Brasil)";
  const currentLabel = isPt ? "PT-BR" : "EN";

  // Remove BabelQuarto's presentation widget. Translation generation remains
  // BabelQuarto's responsibility; this replacement only controls presentation.
  document.querySelectorAll("#languages-links-parent, .babelquarto-languages-button").forEach((node) => {
    const wrapper = node.closest("#languages-links-parent, .nav-item.dropdown, .dropdown") || node;
    if (!wrapper.classList.contains("quarto-needs-language-switch")) wrapper.remove();
  });

  const wrapper = document.createElement("div");
  wrapper.id = "quarto-needs-language-switch";
  wrapper.className = "nav-item dropdown quarto-needs-language-switch";
  wrapper.innerHTML = `
    <a id="languages-button"
       class="nav-link dropdown-toggle"
       href="#"
       role="button"
       data-bs-toggle="dropdown"
       aria-expanded="false"
       aria-label="${isPt ? "Idioma" : "Language"}">
      <span class="quarto-needs-language-globe" aria-hidden="true">🌐</span>
      <span class="quarto-needs-current-language">${currentLabel}</span>
    </a>
    <ul id="languages-links"
        class="dropdown-menu dropdown-menu-end"
        aria-labelledby="languages-button">
      <li><a class="dropdown-item" href="${relativeHref(current, target)}">${targetLabel}</a></li>
    </ul>`;

  // Capture the page palette before inserting the selector into a navbar that
  // may have its own Bootstrap data-bs-theme="dark" color context.
  const page = getComputedStyle(document.body);
  const root = getComputedStyle(document.documentElement);
  const transparent = new Set(["transparent", "rgba(0, 0, 0, 0)"]);
  let pageBg = page.backgroundColor;
  if (!pageBg || transparent.has(pageBg)) pageBg = root.getPropertyValue("--bs-body-bg").trim() || "#fff";
  const pageFg = page.color || root.getPropertyValue("--bs-body-color").trim() || "#212529";
  const pageBorder = root.getPropertyValue("--bs-border-color").trim() || "#dee2e6";
  const pageHover = root.getPropertyValue("--bs-tertiary-bg").trim() || "#f8f9fa";

  wrapper.style.setProperty("--qn-language-bg", pageBg);
  wrapper.style.setProperty("--qn-language-fg", pageFg);
  wrapper.style.setProperty("--qn-language-border", pageBorder);
  wrapper.style.setProperty("--qn-language-hover", pageHover);

  const place = () => {
    const search = document.getElementById("quarto-search");
    if (search && search.parentElement) {
      search.parentElement.insertBefore(wrapper, search.nextSibling);
      return true;
    }
    const tools = document.querySelector(".quarto-navbar-tools");
    if (tools) {
      tools.appendChild(wrapper);
      return true;
    }
    const navbar = document.querySelector(".navbar .container-fluid, .navbar .container, .navbar");
    if (navbar) {
      navbar.appendChild(wrapper);
      return true;
    }
    return false;
  };

  place();
  requestAnimationFrame(place);
  setTimeout(place, 100);
  setTimeout(place, 500);
})();
</script>

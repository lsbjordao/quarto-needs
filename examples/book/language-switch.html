<script>
(() => {
  const locale = document.documentElement.lang || "en";
  const isPt = locale.toLowerCase().startsWith("pt");
  const path = window.location.pathname;

  const stripLocalizedSuffix = (value) => value.replace(/\.pt-BR\.html$/i, ".html");
  const toPortuguese = (value) => {
    if (/\/pt-BR\//i.test(value)) return value;
    const slash = value.lastIndexOf("/");
    const directory = value.slice(0, slash + 1);
    const filename = value.slice(slash + 1);
    const localized = filename.replace(/\.html$/i, ".pt-BR.html");
    return `${directory}pt-BR/${localized}`;
  };
  const toEnglish = (value) => stripLocalizedSuffix(value.replace(/\/pt-BR\//i, "/"));

  const targetPath = isPt ? toEnglish(path) : toPortuguese(path);
  const targetLabel = isPt ? "English" : "Português (Brasil)";
  const currentLabel = isPt ? "PT-BR" : "EN";

  let button = document.getElementById("languages-button");
  let menu = button && document.querySelector('.dropdown-menu[aria-labelledby="languages-button"]');

  if (!button) {
    const navbar = document.querySelector(".navbar-nav, .navbar .container-fluid, .navbar .container");
    if (!navbar) return;

    const wrapper = document.createElement("div");
    wrapper.className = "nav-item dropdown quarto-needs-language-switch";
    wrapper.innerHTML = `
      <a id="languages-button"
         class="nav-link dropdown-toggle babelquarto-languages-button"
         href="#"
         role="button"
         data-bs-toggle="dropdown"
         aria-expanded="false"
         aria-label="Language">
        <span class="quarto-needs-current-language">${currentLabel}</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languages-button"></ul>`;
    navbar.appendChild(wrapper);
    button = wrapper.querySelector("#languages-button");
    menu = wrapper.querySelector(".dropdown-menu");
  }

  if (!menu) return;

  button.setAttribute("aria-label", isPt ? "Idioma" : "Language");
  button.querySelectorAll(".quarto-needs-current-language").forEach((node) => node.remove());
  const current = document.createElement("span");
  current.className = "quarto-needs-current-language";
  current.textContent = currentLabel;
  button.prepend(current);

  menu.innerHTML = "";
  const item = document.createElement("li");
  const link = document.createElement("a");
  link.className = "dropdown-item";
  link.href = `${targetPath}${window.location.search}${window.location.hash}`;
  link.textContent = targetLabel;
  item.appendChild(link);
  menu.appendChild(item);
})();
</script>

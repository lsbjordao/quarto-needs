project:
  type: book
  output-dir: _book
  pre-render: python3 _pre_render.py

book:
  title: "Aegis IAM — traceable requirements"
  navbar:
    search: true
  chapters:
    - index.qmd
    - context/stakeholders.qmd
    - part: Requirements
      part-pt-BR: Requisitos
      chapters:
        - requirements/system.qmd
        - requirements/functional.qmd
        - requirements/non-functional.qmd
    - part: Architecture
      part-pt-BR: Arquitetura
      chapters:
        - architecture/decisions.qmd
        - architecture/components.qmd
    - risks/security.qmd
    - verification/test-cases.qmd
    - verification/evidence.qmd
    - traceability.qmd
    - matrices.qmd
    - governance.qmd
    - diagrams.qmd
    - shortcodes.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    css: language-switch.css
    include-after-body: language-switch.html
    mermaid-format: svg

filters:
  - quarto-needs

babelquarto:
  languagelinks: navbar
  icon: ""
  languagecodes:
    - name: en
      text: "English"
    - name: pt-BR
      text: "Português (Brasil)"
  mainlanguage: en
  languages: [pt-BR]

title-pt-BR: "Aegis IAM — requisitos rastreáveis"
lang: en

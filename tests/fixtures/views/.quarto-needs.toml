# The named queries this fixture's shortcodes reference.
#
# `index.qmd` calls `need-dashboard query="authentication-work"`,
# `need-matrix query="traceable-pair"` and several
# `query="approved-requirements"` shortcodes. Without this file the project
# has no configuration, so the engine materializes no named queries and
# emits no precomputed report -- and every view built on one renders empty.
#
# `approved-requirements` is the built-in default query and is deliberately
# not redeclared here.

[queries.authentication-work]
all = [
  { field = "tags", op = "contains", value = "authentication" },
]
sort = ["id:asc"]

[queries.traceable-pair]
any = [
  { relation = "verified-by", direction = "out", op = "exists" },
  { relation = "verified-by", direction = "in", op = "exists" },
]
sort = ["id:asc"]

# REQ-APPROVED is approved and carries only a verification relation, so this
# default-off rule produces a real finding on it. The inspector shortcodes
# assert that findings reach the rendered card, which needs a finding the
# engine genuinely emits from this fixture's content.
[rules.REQ011]
enabled = true

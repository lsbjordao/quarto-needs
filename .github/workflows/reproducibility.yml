name: Reproducibility

"on":
  push:
  pull_request:

concurrency:
  group: reproducibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    name: Artifacts / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Provision the pt-BR collation locale
        if: runner.os == 'Linux'
        run: |
          sudo locale-gen pt_BR.UTF-8
          sudo update-locale
      - name: Run the subprocess perturbation matrix
        run: python tools/reproducibility.py matrix --output perturbations
      - name: Collect this runtime's reference artifacts
        shell: bash
        run: |
          mkdir -p runtime
          cp -R perturbations/reference/artifacts "runtime/${{ matrix.os }}-py${{ matrix.python-version }}"
      - name: Upload this runtime's artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-${{ matrix.os }}-py${{ matrix.python-version }}
          path: runtime/
          if-no-files-found: error

  reproducibility:
    name: reproducibility
    needs: artifacts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Require every perturbation leg to have succeeded
        run: |
          echo "artifacts result: ${{ needs.artifacts.result }}"
          test "${{ needs.artifacts.result }}" = "success"
      - name: Download every runtime's artifacts
        uses: actions/download-artifact@v4
        with:
          path: runtimes
          pattern: reproducibility-*
          merge-multiple: true
      - name: Compare artifacts across every operating system and Python version
        shell: bash
        run: |
          shopt -s nullglob
          directories=(runtimes/*/)
          echo "comparing ${#directories[@]} runtimes"
          test "${#directories[@]}" -eq 15
          python tools/reproducibility.py compare "${directories[@]}"

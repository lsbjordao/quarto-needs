name: CI

"on":
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run test suite
        run: python -m pytest -q
      - name: Scan self-hosted example
        run: quarto-needs --root examples/quarto-needs scan
      - name: Check self-hosted example
        run: quarto-needs --root examples/quarto-needs check

  vscode:
    name: VS Code language client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Quarto-Needs language server
        working-directory: .
        run: python -m pip install -e .
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install language-client dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check VS Code client
        run: npm run check
      - name: Compile VS Code client
        run: npm run compile
      - name: Exercise Extension Host through Python LSP
        run: xvfb-run -a npm run test:extension
      - name: Package VSIX
        run: npm run package
      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: quarto-needs-vscode
          path: editors/vscode/quarto-needs-vscode.vsix
          if-no-files-found: error

  quarto:
    name: Quarto multilingual render smoke
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and test dependencies
        run: make setup
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
      - name: Install babelquarto
        run: make setup-babelquarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
          tinytex: true
      - name: Test responsive margin-sidebar behavior
        run: |
          command -v google-chrome
          .venv/bin/python -m pytest -q tests/test_margin_sidebar.py::test_collapsed_margin_sidebar_stays_hidden_across_left_sidebar_breakpoint
      - name: Synchronize extension and graph
        run: make sync-self-example
      - name: Render multilingual self-hosted HTML
        run: make render-self-example
      - name: Render multilingual Quarto-Needs manual
        run: make render-manual-multilingual
      - name: Enforce example gates
        run: make check-self-example

  install:
    name: Installed consumer path
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
          tinytex: true
      - name: Install poppler-utils
        # check_extension_first_path.sh asserts PDF content with pdftotext,
        # which ubuntu-latest does not ship by default.
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify both installation paths
        # check-install runs the extension-first scenario (the primary one)
        # and the CLI-installed scenario (still supported).
        run: make check-install

  quarto-minimum:
    name: Quarto minimum version smoke
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and test dependencies
        run: make setup
      - name: Set up the declared minimum Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.0"
          tinytex: true
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Verify the extension-first path on the declared minimum Quarto
        # `quarto-required: ">=1.6.0"` is a claim about the metadata
        # contribution and the relative `quarto run` command. Metadata
        # extensions predate the floor, but predating it is not the same as
        # working on it, so the floor is gated here rather than assumed.
        run: make check-extension-first

  quality:
    name: Quality artifacts
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Generate PR engineering change projections
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts
          RANGE="$BASE_SHA..$HEAD_SHA"
          quarto-needs --root examples/quarto-needs pr-report --git "$RANGE" --recompute-with current --format json > artifacts/pr-report.json
          quarto-needs --root examples/quarto-needs github-report --git "$RANGE" --recompute-with current --format markdown > artifacts/pr-summary.md
          quarto-needs --root examples/quarto-needs github-report --git "$RANGE" --recompute-with current --format annotations > artifacts/pr-annotations.txt
          cat artifacts/pr-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/pr-annotations.txt
      - name: Generate deterministic quality artifacts
        env:
          SOURCE_DATE_EPOCH: "1787702400"
        run: |
          mkdir -p artifacts
          quarto-needs --root examples/quarto-needs export --format json --output "$GITHUB_WORKSPACE/artifacts/needs.json"
          quarto-needs --root examples/quarto-needs export --format csv --output "$GITHUB_WORKSPACE/artifacts/csv"
          quarto-needs --root examples/quarto-needs export --format sarif --output "$GITHUB_WORKSPACE/artifacts/findings.sarif"
          quarto-needs --root examples/quarto-needs export --format junit --output "$GITHUB_WORKSPACE/artifacts/gates.xml"
          quarto-needs --root examples/quarto-needs export --format markdown --output "$GITHUB_WORKSPACE/artifacts/summary.md" --baseline examples/quarto-needs/baselines/quarto-needs.json
          quarto-needs --root examples/quarto-needs quality --format json --output "$GITHUB_WORKSPACE/artifacts/quality.json"
      - name: Publish job summary
        if: always()
        run: |
          if [[ -f artifacts/summary.md ]]
          then
            cat artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Quarto-Needs summary was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarto-needs-quality
          path: artifacts/
          if-no-files-found: warn
      - name: Upload SARIF to code scanning
        if: always() && github.event_name != 'pull_request'
        # Requires the repository's own Code scanning setting (Settings ->
        # Security -> Code security) to be enabled; the workflow permission
        # (security-events: write, above) is necessary but not sufficient.
        # An unenabled setting is a deliberate choice, not a defect in the
        # SARIF this job produced, so it must not fail the job over it --
        # the quality-artifacts upload just above already succeeded and
        # carries the same findings.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/findings.sarif

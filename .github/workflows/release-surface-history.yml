name: Release surface history

"on":
  push:
    branches: [main]
  pull_request:

concurrency:
  group: release-surface-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-release-surfaces:
    name: Frozen release surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Verify frozen surfaces against immutable Git tags
        env:
          QUARTO_NEEDS_REQUIRE_RELEASE_TAGS: "1"
        run: python -m pytest -q tests/test_release_surfaces.py
